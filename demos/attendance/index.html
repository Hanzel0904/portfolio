<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pamantasan ng Lungsod ng Pasig</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="bg"></div>
  <div class="page">
    <div class="card">
      <h2>Welcome Back!</h2>
      <p class="subtitle">Please enter your credentials to continue.</p>
      <form action="dashboard.html" method="get" autocomplete="on">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"/>
              <path d="M14 14s-1-1-6-1-6 1-6 1 .5-4 6-4 6 4 6 4Zm-1.065-.75c-.123-.55-.73-2.25-4.935-2.25-4.207 0-4.814 1.7-4.936 2.25h9.87Z"/>
            </svg>
            <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username">
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 1a2.5 2.5 0 0 0-2.5 2.5V6H4a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-1.5V3.5A2.5 2.5 0 0 0 8 1Zm1.5 5h-3V3.5a1.5 1.5 0 0 1 3 0V6Z"/>
            </svg>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
            <button class="toggle-pw" type="button" id="toggleBtn" aria-label="Show password">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8Zm-8 4.5A4.5 4.5 0 1 1 8 3a4.5 4.5 0 0 1 0 9Z"/>
                <path d="M8 5.5A2.5 2.5 0 1 0 8 10.5 2.5 2.5 0 0 0 8 5.5Z"/>
              </svg>
            </button>
          </div>
        </div>
        <button class="btn-signin" type="submit">Sign In</button>
      </form>
    </div>
  </div>
  <div class="footer">© 2026 Pamantasan ng Lungsod ng Pasig. All rights reserved.</div>
  <script>
    document.getElementById("toggleBtn").addEventListener("click", function () {
      var pw = document.getElementById("password");
      pw.type = pw.type === "password" ? "text" : "password";
    });
  </script>
</body>
</html>
