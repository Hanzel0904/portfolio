<!DOCTYPE html>
<html lang="en">

<head>
<base href="/demos/attendance/">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pamantasan ng Lungsod ng Pasig</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --card-bg: rgba(255, 255, 255, 0.2);
            --card-border: rgba(255, 255, 255, 0.4);
            --field-bg: rgba(255, 255, 255, 0.88);
            --field-border: rgba(255, 255, 255, 0.6);
            --text-main: #113020;
            --text-muted: #2e4b3e;
            --green-primary: #1b9f53;
            --green-hover: #147c40;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            color: var(--text-main);
        }

        .bg {
            position: fixed;
            inset: 0;
            background: url('assets/Welcome back to (1).svg') center center / cover no-repeat;
            opacity: 0;
            animation: bgFadeIn 0.85s ease-out forwards;
        }

        .page {
            position: relative;
            z-index: 1;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 36px;
        }

        .card {
            width: min(460px, calc(100vw - 72px));
            margin-left: 62vw;
            margin-right: clamp(22px, 3vw, 52px);
            border-radius: 24px;
            padding: 40px 34px 34px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow:
                0 20px 55px rgba(0, 0, 0, 0.35),
                0 8px 25px rgba(0, 0, 0, 0.18);
            opacity: 0;
            transform: translateY(24px) scale(0.96);
            animation: cardPopIn 0.52s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
            will-change: transform, opacity;
        }

        .card h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .card p.subtitle {
            font-size: 0.95rem;
            color: #ffffff;
            margin-bottom: 22px;
        }

        .error {
            margin: 0 0 18px;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(185, 28, 28, 0.14);
            border: 1px solid rgba(185, 28, 28, 0.2);
            color: #7f1d1d;
            font-weight: 600;
            font-size: 0.88rem;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 7px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap svg.icon {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: #5c7468;
            pointer-events: none;
        }

        .input-wrap input {
            width: 100%;
            height: 50px;
            border: 1px solid var(--field-border);
            border-radius: 12px;
            padding: 0 44px 0 42px;
            font-size: 0.93rem;
            font-family: 'Poppins', sans-serif;
            color: #153a28;
            background: var(--field-bg);
            outline: none;
            box-shadow:
                inset 0 1px 2px rgba(255, 255, 255, 0.55),
                0 4px 14px rgba(0, 0, 0, 0.08);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .input-wrap input::placeholder {
            color: #5f756a;
        }

        .input-wrap input:focus {
            border-color: #1b9f53;
            background: rgba(255, 255, 255, 0.95);
            box-shadow:
                inset 0 1px 2px rgba(255, 255, 255, 0.6),
                0 0 0 3px rgba(27, 159, 83, 0.15);
        }

        .toggle-pw {
            position: absolute;
            right: 13px;
            background: none;
            border: none;
            cursor: pointer;
            color: #5c7468;
            display: flex;
            align-items: center;
            padding: 0;
            height: 100%;
        }

        .toggle-pw svg {
            width: 22px;
            height: 22px;
        }

        .btn-signin {
            width: 100%;
            height: 52px;
            background: var(--green-primary);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
            letter-spacing: 0.2px;
            margin-top: 6px;
            box-shadow: 0 12px 22px rgba(20, 124, 64, 0.35);
        }

        .btn-signin:hover {
            background: var(--green-hover);
            transform: translateY(-1px);
        }

        .footer {
            position: absolute;
            bottom: 14px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.72);
            z-index: 2;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            z-index: 9999;
        }
        .modal-backdrop.show { display: flex; }
        .modal-card {
            width: min(520px, 100%);
            background: #fff;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 18px 60px rgba(0,0,0,0.35);
        }
        .modal-title { font-size: 1.15rem; margin: 0 0 8px; font-weight: 800; color:#111827; }
        .modal-text { margin: 0 0 14px; color:#374151; line-height: 1.45; }
        .modal-actions { display:flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
        .btn {
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 800;
            font-family: inherit;
        }
        .btn-primary { background:#00a651; color:#fff; }
        .btn-secondary { background:#f3f4f6; color:#111827; }
        .modal-note { margin-top: 10px; color:#6b7280; font-size: 0.9rem; }

        @keyframes bgFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes cardPopIn {
            0% {
                opacity: 0;
                transform: translateY(24px) scale(0.96);
            }
            60% {
                opacity: 1;
                transform: translateY(-2px) scale(1.01);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 1100px) {
            .page {
                justify-content: center;
                padding: 30px 20px;
            }
            .card {
                margin-left: 0;
                margin-right: 0;
                width: min(480px, 100%);
            }
        }

        @media (max-width: 640px) {
            .card {
                padding: 32px 20px 24px;
                border-radius: 20px;
            }
            .card h2 {
                font-size: 1.75rem;
            }
            .footer {
                bottom: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .bg,
            .card {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>

<body>

    <div class="bg"></div>

    <div class="page">
        <div class="card">
            <h2>Welcome Back!</h2>
            <p class="subtitle">Please enter your credentials to continue.</p>

            
              <div class="error"></div>
            

            <form method="get" action="dashboard.html" autocomplete="on">
              <div class="field">
                  <label for="username">Username</label>
                  <div class="input-wrap">
                      <svg class="icon bi bi-person" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                          <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"/>
                          <path d="M14 14s-1-1-6-1-6 1-6 1 .5-4 6-4 6 4 6 4Zm-1.065-.75c-.123-.55-.73-2.25-4.935-2.25-4.207 0-4.814 1.7-4.936 2.25h9.87Z"/>
                      </svg>
                      <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" value="" />
                  </div>
              </div>

              <div class="field">
                  <label for="password">Password</label>
                  <div class="input-wrap">
                      <svg class="icon bi bi-lock" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                          <path d="M8 1a2.5 2.5 0 0 0-2.5 2.5V6H4a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-1.5V3.5A2.5 2.5 0 0 0 8 1Zm1.5 5h-3V3.5a1.5 1.5 0 0 1 3 0V6Z"/>
                      </svg>
                      <input type="password" id="password" name="password" placeholder="Enter your password"
                          autocomplete="current-password" />
                      <button class="toggle-pw" onclick="togglePw()" type="button" id="toggleBtn">
                          <svg id="eyeIcon" class="bi bi-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                              <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8Zm-8 4.5A4.5 4.5 0 1 1 8 3a4.5 4.5 0 0 1 0 9Z"/>
                              <path d="M8 5.5A2.5 2.5 0 1 0 8 10.5 2.5 2.5 0 0 0 8 5.5Z"/>
                          </svg>
                      </button>
                  </div>
              </div>

              <button class="btn-signin" type="submit">Sign In</button>
            </form>

         </div>
    </div>

    <div class="footer">© 2026 Pamantasan ng Lungsod ng Pasig. All rights reserved.</div>

    <div class="modal-backdrop" id="blockedModal" role="dialog" aria-modal="true" aria-labelledby="blockedTitle">
      <div class="modal-card">
        <h3 class="modal-title" id="blockedTitle">Account blocked</h3>
        <p class="modal-text">
          This account has been blocked and needs to be activated again by the administrator.
        </p>
        <div class="modal-actions">
          <button class="btn btn-secondary" type="button" onclick="closeBlocked()">Close</button>
          <button class="btn btn-primary" type="button" onclick="requestActivation()">Activate</button>
        </div>
        <div class="modal-note" id="blockedNote"></div>
      </div>
    </div>

    <script>
        function togglePw() {
            const pw = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (pw.type === 'password') {
                pw.type = 'text';
                icon.innerHTML = `<path d="M13.359 11.238 15 12.879 14.293 13.586l-1.718-1.718A8.95 8.95 0 0 1 8 13.5C3 13.5 0 8 0 8a15.37 15.37 0 0 1 3.335-3.942L1 1.707 1.707 1l13 13-.707.707-1.64-1.469ZM11.297 10.59 9.51 8.803a1.5 1.5 0 0 1-2.121-2.12L5.955 5.248A3.5 3.5 0 0 0 8 11.5a3.49 3.49 0 0 0 3.297-.91Z"/><path d="M5.525 3.34A8.98 8.98 0 0 1 8 2.5C13 2.5 16 8 16 8a15.32 15.32 0 0 1-2.04 2.677l-.726-.726A14.33 14.33 0 0 0 14.84 8c-.42-.642-2.6-3.5-6.84-3.5-.726 0-1.41.083-2.052.24l-.423-.4Z"/>`;
            } else {
                pw.type = 'password';
                icon.innerHTML = `<path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8Zm-8 4.5A4.5 4.5 0 1 1 8 3a4.5 4.5 0 0 1 0 9Z"/><path d="M8 5.5A2.5 2.5 0 1 0 8 10.5 2.5 2.5 0 0 0 8 5.5Z"/>`;
            }
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
              const form = document.querySelector('form');
              if (form) form.submit();
            }
        });

        const blockedModal = document.getElementById('blockedModal');
        const blockedNote = document.getElementById('blockedNote');
        const blockedUsername = ;

        function openBlocked() {
          if (!blockedModal) return;
          blockedModal.classList.add('show');
        }
        function closeBlocked() {
          if (!blockedModal) return;
          blockedModal.classList.remove('show');
        }
        async function requestActivation() {
          blockedNote.textContent = 'Sending activation email...';
          try {
            const fd = new FormData();
            fd.append('username', blockedUsername || document.getElementById('username').value.trim());
            const res = await fetch('ajax/request_activation.php', { method: 'POST', body: fd });
            const data = await res.json();
            blockedNote.textContent = data && data.success ? (data.message || 'Activation email sent.') : (data.error || 'Failed to send activation email.');
          } catch (e) {
            blockedNote.textContent = 'Failed to send activation email.';
          }
        }

        
          openBlocked();
        
    </script>

</body>

</html>
