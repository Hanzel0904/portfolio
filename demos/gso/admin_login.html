<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - PLP GSO Supply Tracking and Monitoring System</title>

  <script src="https://unpkg.com/feather-icons@4.29.0/dist/feather.min.js"></script>

  <style>
    /* ... (CSS remains the same as before) ... */
    :root {
      --primary: #2f80ed;
      --primary-hover: #1c6dd0;
      --background: #f4f7f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
      --border-radius: 12px;
      --shadow: 0 6px 20px rgba(0, 0, 102, 0.12);
      --error-color: #e74c3c;
      --success-color: #2ecc71;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
    }

    .header {
      text-align: center;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .header h1 {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .form-section {
      margin-bottom: 2rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
      max-width: 450px;
      margin-left: auto;
      margin-right: auto;
    }

    .form-control {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    input, select {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--border-radius);
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(47, 128, 237, 0.2);
    }

    .required-field::after {
      content: " *";
      color: var(--error-color);
    }

    .submit-btn {
      padding: 0.9rem 2rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin: 1.5rem auto 0;
      width: 100%;
      max-width: 300px;
    }

    .submit-btn:hover {
      background-color: var(--primary-hover);
    }

    .alert {
      padding: 1rem;
      margin-bottom: 1.5rem;
      border-radius: var(--border-radius);
      text-align: center;
      font-weight: 500;
    }

    .alert-danger {
      background-color: rgba(231, 76, 60, 0.1);
      color: var(--error-color);
      border: 1px solid rgba(231, 76, 60, 0.3);
    }

    .alert-success {
      background-color: rgba(46, 204, 113, 0.1);
      color: var(--success-color);
      border: 1px solid rgba(46, 204, 113, 0.3);
    }

    .info-section {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.95rem;
    }

    .info-section a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .info-section a:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    .forgot-password {
      text-align: right;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    .forgot-password a {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .forgot-password a:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    /* Password visibility toggle styles */
    .password-input {
      position: relative;
      width: 100%;
      display: inline-block;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      background: none;
      border: none;
      color: var(--text);
      opacity: 0.7;
      padding: 0;
      display: flex;
      align-items: center;
      z-index: 10;
    }

    .toggle-password:hover {
      opacity: 1;
    }

    #password, #username {
      width: 100%;
      box-sizing: border-box;
    }

    #password {
      padding-right: 40px; /* Make room for the icon */
    }

    @media (max-width: 768px) {
      .container {
        padding: 1.5rem;
      }

      body {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Admin Login - PLP GSO Supply Tracking and Monitoring System</h1>
    </div>

    
    <div class="alert alert-danger">
      
    </div>
    

    <form method="get" action="dashboard.html">
      <div class="form-section">
        <h2 class="section-title" style="text-align: center; margin-bottom: 1.5rem;">Admin Login</h2>
        <div class="form-grid">
          <div class="form-control">
            <label for="username" class="required-field">
              <i data-feather="user"></i>Username or Email
            </label>
            <input type="text" id="username" name="username" required placeholder="Enter your username or email" />
          </div>

          <div class="form-control">
            <label for="password" class="required-field">
              <i data-feather="lock"></i>Password
            </label>
            <div class="password-input">
              <input type="password" id="password" name="password" required placeholder="Enter your password" />
              <button type="button" class="toggle-password" aria-label="Show password">
                <i data-feather="eye" id="password-toggle-icon"></i>
              </button>
            </div>
            <div class="forgot-password">
              <a href="forgot_password.html">Forgot Password?</a>
            </div>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn">
        <i data-feather="log-in"></i>Login
      </button>

      <div class="info-section">
        Are you a regular user? <a href="index.html">Login Here</a>
      </div>
    </form>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize Feather Icons
      if (typeof feather !== 'undefined') {
        feather.replace();
      }

      // Auto hide alerts after 5 seconds
      const alerts = document.querySelectorAll('.alert');
      alerts.forEach(alert => {
        setTimeout(() => {
          alert.style.opacity = '0';
          alert.style.transition = 'opacity 0.5s ease';
          setTimeout(() => {
            alert.style.display = 'none';
          }, 500);
        }, 5000);
      });

      // Password visibility toggle
      const togglePassword = document.querySelector('.toggle-password');
      const passwordInput = document.querySelector('#password');

      if (togglePassword) {
        togglePassword.addEventListener('click', function() {
          // Toggle the input type
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);

          // Replace the entire button content with the appropriate icon
          if (type === 'text') {
            // Password is visible, show the "hide" icon
            togglePassword.innerHTML = '<i data-feather="eye-off" id="password-toggle-icon"></i>';
          } else {
            // Password is hidden, show the "show" icon
            togglePassword.innerHTML = '<i data-feather="eye" id="password-toggle-icon"></i>';
          }

          // Re-initialize feather icons to render the new icon
          if (typeof feather !== 'undefined') {
            feather.replace();
          }
        });
      }
    });
  </script>
</body>
</html>
