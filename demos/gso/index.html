<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login - PLP GSO Supply Tracking and Monitoring System</title>
  <script src="https://unpkg.com/feather-icons@4.29.0/dist/feather.min.js"></script>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>PLP GSO Supply Tracking and Monitoring System</h1>
    </div>
    <form action="dashboard.html" method="get">
      <div class="form-section">
        <h2 class="section-title" style="text-align: center; margin-bottom: 1.5rem;">User Login</h2>
        <div class="form-grid">
          <div class="form-control">
            <label for="username" class="required-field">
              <i data-feather="user"></i>Username or Email
            </label>
            <input type="text" id="username" name="username" required placeholder="Enter your username or email">
          </div>
          <div class="form-control">
            <label for="password" class="required-field">
              <i data-feather="lock"></i>Password
            </label>
            <div class="password-input">
              <input type="password" id="password" name="password" required placeholder="Enter your password">
              <button type="button" class="toggle-password" aria-label="Show password">
                <i data-feather="eye" id="password-toggle-icon"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
      <button type="submit" class="submit-btn">
        <i data-feather="log-in"></i>Login
      </button>
      <div class="info-section">
        Model demo of the original login screen. Any sample login opens the dashboard.
      </div>
    </form>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.feather) feather.replace();
      var toggle = document.querySelector(".toggle-password");
      var password = document.querySelector("#password");
      toggle.addEventListener("click", function () {
        var show = password.getAttribute("type") === "password";
        password.setAttribute("type", show ? "text" : "password");
        toggle.innerHTML = '<i data-feather="' + (show ? "eye-off" : "eye") + '"></i>';
        feather.replace();
      });
    });
  </script>
</body>
</html>
