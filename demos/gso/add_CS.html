<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Central Supply Request Item</title>

  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashb-gso.css">

  <style>
    :root {
      --primary: #2f80ed;
      --primary-hover: #1c6dd0;
      --background: #f4f7f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
      --border-radius: 12px;
      --shadow: 0 6px 20px rgba(0, 0, 102, 0.12);
      --danger: #e74c3c;
      --danger-hover: #c0392b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Raleway', san-serif;
      background-color: var(--background);
      color: var(--text);
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      padding: 2.5rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .header h1 {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .form-section {
      margin-bottom: 2rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .form-control {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .form-control.full {
      grid-column: span 2;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
    }

    input, select {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--border-radius);
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(47, 128, 237, 0.2);
    }

    input:read-only {
      background-color: #f9f9f9;
      cursor: not-allowed;
    }

    /* Visual feedback for required fields */
    input:required {
      border-left: 3px solid var(--primary);
    }

    .product-section {
      margin: 2rem 0;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }

    .product-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .product-header h2 {
      font-size: 1.3rem;
      color: var(--text);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr) auto;
      gap: 1rem;
      margin-bottom: 1.5rem;
      align-items: end;
      position: relative;
    }

    .product-row {
      margin-bottom: 1.5rem;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--border-radius);
      background-color: #fafafa;
      position: relative;
    }

    .delete-btn {
      background-color: var(--danger);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      padding: 0.5rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      height: fit-content;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .delete-btn:hover {
      background-color: var(--danger-hover);
    }

    .delete-btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .add-product-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: color 0.2s ease;
      margin-top: 1rem;
      text-align: right;
      margin-left: auto;
    }

    .add-product-btn:hover {
      color: var(--primary-hover);
    }

    .submit-btn {
      padding: 0.9rem 2rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: block;
      margin-left: auto;
      margin-top: 1.5rem;
    }

    .submit-btn:hover {
      background-color: var(--primary-hover);
    }

    /* Form section titles */
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .required-field::after {
      content: " *";
      color: #e74c3c;
    }

    .error-message {
        color: red;
        font-size: 0.85rem;
        margin-top: 0.25rem;
        position: absolute;
        bottom: -20px;
        left: 0;
        background-color: #ffebee;
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        border: 1px solid #ffcdd2;
    }

    .row-number {
      position: absolute;
      top: -10px;
      left: 10px;
      background-color: var(--primary);
      color: white;
      padding: 0.2rem 0.5rem;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-control.full {
        grid-column: span 1;
      }

      .product-grid {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 1.5rem;
      }

      body {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Central Supply Request Item</h1>
    </div>
      <form id="requestForm" method="POST" action="#" onsubmit="return false;">
        <div class="form-section">
        <h2 class="section-title">Request Information</h2>
        <div class="form-grid">
  <div class="form-control">
    <label for="risNo">RIS No</label>
    <input type="text" id="risNo" name="risNo" value="" readonly />
  </div>

  <div class="form-control">
    <label for="requested_date">Requested Date</label>
    <input type="date" id="requested_date" name="requested_date" required />
  </div>

  <div class="form-control">
    <label for="department">Department</label>
    <input type="text" id="department" name="department" value="" readonly />
  </div>

  <div class="form-control">
    <label for="full_name">Name</label>
    <input type="text" id="full_name" name="full_name" value="" readonly />
  </div>
</div>


      </div>

        <div class="product-section">
        <div class="product-header">
          <h2>Product Information</h2>
        </div>

        <div id="productList">
          <div class="product-row">
            <div class="row-number">1</div>
            <div class="product-grid">
              <div class="form-control">
                <label for="type">Type</label>
                <select name="type[]" class="type-select" required>
                  <option value="">-- Select Type --</option>
                  
                    <option value=""></option>
                  
                </select>
              </div>

              <div class="form-control">
                <label>Item Name</label>
                <select name="itemName[]" class="item-select" required>
                  <option value="">-- Select Item Name --</option>
                </select>
              </div>

              <div class="form-control">
                <label>Description</label>
                <select name="description[]" class="desc-select" required>
                  <option value="">-- Select Description --</option>
                </select>
              </div>

              <div class="form-control">
                <label>Requested Quantity</label>
                <input type="number" name="quantity[]" min="1" required placeholder="Enter quantity"/>
              </div>

              <div class="form-control">
                <button type="button" class="delete-btn" onclick="deleteRow(this)" disabled>
                  ✕ Delete
                </button>
              </div>
            </div>
          </div>
        </div>

        <button id="addMoreBtn" class="add-product-btn" type="button">+ Add more products</button>

        <button type="submit" class="submit-btn">Submit Request</button>
      </form>
    </div>
  </div>

  <script>
    // Function to delete a row
    function deleteRow(button) {
      const productRow = button.closest('.product-row');
      const productList = document.getElementById('productList');
      
      // Only allow deletion if there's more than one row
      if (productList.children.length > 1) {
        productRow.remove();
        updateRowNumbers();
        updateDeleteButtons();
        validateAllRows(); // Re-validate after deletion
      }
    }

    // Function to update row numbers and ensure they are sequential
    function updateRowNumbers() {
      const rows = document.querySelectorAll('.product-row');
      rows.forEach((row, index) => {
        const rowNumber = row.querySelector('.row-number');
        if (rowNumber) {
          rowNumber.textContent = index + 1;
        }
      });
    }

    // Function to update delete button states
    function updateDeleteButtons() {
      const deleteButtons = document.querySelectorAll('.delete-btn');
      const shouldDisable = deleteButtons.length <= 1;
      
      deleteButtons.forEach(btn => {
        btn.disabled = shouldDisable;
      });
    }

    // Function to get the next row number based on existing rows
    function getNextRowNumber() {
      const rows = document.querySelectorAll('.product-row');
      return rows.length + 1;
    }

    document.addEventListener("DOMContentLoaded", function() {
  // Set default date to today
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('requested_date').value = today;

  // Store the itemData as a JavaScript object
  const itemData = ;

  // Function to get all currently selected combinations of (Type, Item Name, Description)
  function getSelectedCombinations() {
    const combinations = new Set();
    document.querySelectorAll('.product-grid').forEach(row => {
      const type = row.querySelector('.type-select').value;
      const itemName = row.querySelector('.item-select').value;
      const description = row.querySelector('.desc-select').value;

      if (type && itemName && description) {
        combinations.add(`${type}|${itemName}|${description}`);
      }
    });
    return combinations;
  }

  // Function to validate a specific row for duplicates
  function validateRowForDuplicates(currentRow) {
    const typeSelect = currentRow.querySelector('.type-select');
    const itemSelect = currentRow.querySelector('.item-select');
    const descSelect = currentRow.querySelector('.desc-select');

    const type = typeSelect.value;
    const itemName = itemSelect.value;
    const description = descSelect.value;

    const currentCombination = `${type}|${itemName}|${description}`;

    // Get all combinations excluding the current row's selections
    const otherCombinations = new Set();
    document.querySelectorAll('.product-grid').forEach(row => {
      if (row !== currentRow) {
        const otherType = row.querySelector('.type-select').value;
        const otherItemName = row.querySelector('.item-select').value;
        const otherDescription = row.querySelector('.desc-select').value;
        if (otherType && otherItemName && otherDescription) {
          otherCombinations.add(`${otherType}|${otherItemName}|${otherDescription}`);
        }
      }
    });

    const productRow = currentRow.closest('.product-row');
    const errorMessageSpan = productRow.querySelector('.error-message');
    if (errorMessageSpan) {
      errorMessageSpan.remove(); // Clear previous error messages
    }

    if (type && itemName && description && otherCombinations.has(currentCombination)) {
      const newErrorSpan = document.createElement('span');
      newErrorSpan.className = 'error-message';
      newErrorSpan.textContent = 'This item combination is already selected.';
      productRow.appendChild(newErrorSpan);
      return false;
    }
    return true;
  }

  // Function to run validation on all rows
  window.validateAllRows = function() {
    let allValid = true;
    document.querySelectorAll('.product-grid').forEach(row => {
      if (!validateRowForDuplicates(row)) {
        allValid = false;
      }
    });
    return allValid;
  }

  // Function to populate type options in a select element
  function populateTypeOptions(selectElement) {
    // Clear existing options first
    selectElement.innerHTML = '<option value="">-- Select Type --</option>';
    
    // Add options for each type in itemData
    for (const type in itemData) {
      if (itemData.hasOwnProperty(type)) {
        const option = document.createElement('option');
        option.value = type;
        option.textContent = type;
        selectElement.appendChild(option);
      }
    }
  }
  
  // Function to populate item names based on selected type
  function populateItemNames(typeSelectElement, itemSelectElement) {
    const selectedType = typeSelectElement.value;
    
    // Clear existing options
    itemSelectElement.innerHTML = '<option value="">-- Select Item Name --</option>';
    
    if (selectedType && itemData[selectedType]) {
      // Create a Set to track unique item names
      const uniqueNames = new Set();
      
      // Add each unique item name as an option
      itemData[selectedType].forEach(item => {
        if (!uniqueNames.has(item.name)) {
          const option = document.createElement('option');
          option.value = item.name;
          option.textContent = item.name;
          itemSelectElement.appendChild(option);
          uniqueNames.add(item.name);
        }
      });
    }
  }
  
  // Function to populate descriptions based on selected type and item name
  function populateDescriptions(typeSelectElement, itemSelectElement, descSelectElement) {
    const selectedType = typeSelectElement.value;
    const selectedItem = itemSelectElement.value;
    
    // Clear existing options
    descSelectElement.innerHTML = '<option value="">-- Select Description --</option>';
    
    if (selectedType && selectedItem && itemData[selectedType]) {
      // Filter items that match both the selected type and item name
      const matchingItems = itemData[selectedType].filter(item => item.name === selectedItem);
      
      // Add each matching description as an option
      matchingItems.forEach(item => {
        const option = document.createElement('option');
        option.value = item.description;
        option.textContent = item.description;
        descSelectElement.appendChild(option);
      });
    }
  }
  
  // Function to handle type selection change
  function handleTypeChange(event) {
    const typeSelect = event.target;
    const row = typeSelect.closest('.product-grid');
    const itemSelect = row.querySelector('.item-select');
    const descSelect = row.querySelector('.desc-select');
    
    populateItemNames(typeSelect, itemSelect);
    // Clear descriptions when type changes
    descSelect.innerHTML = '<option value="">-- Select Description --</option>';
    validateRowForDuplicates(row); // Validate on change
  }
  
  // Function to handle item name selection change
  function handleItemChange(event) {
    const itemSelect = event.target;
    const row = itemSelect.closest('.product-grid');
    const typeSelect = row.querySelector('.type-select');
    const descSelect = row.querySelector('.desc-select');
    
    populateDescriptions(typeSelect, itemSelect, descSelect);
    validateRowForDuplicates(row); // Validate on change
  }

  // Function to handle description selection change
  function handleDescriptionChange(event) {
    const descSelect = event.target;
    const row = descSelect.closest('.product-grid');
    validateRowForDuplicates(row); // Validate on change
  }
  
  // Add event listeners to the first row
  const initialTypeSelect = document.querySelector('.type-select');
  const initialItemSelect = document.querySelector('.item-select');
  const initialDescSelect = document.querySelector('.desc-select'); // Get the initial description select
  if (initialTypeSelect) {
    initialTypeSelect.addEventListener('change', handleTypeChange);
  }
  if (initialItemSelect) {
    initialItemSelect.addEventListener('change', handleItemChange);
  }
  if (initialDescSelect) {
    initialDescSelect.addEventListener('change', handleDescriptionChange);
  }
  
  // Handle "Add more products" button click
  document.getElementById('addMoreBtn').addEventListener('click', function() {
    // Get the product list container
    const productList = document.getElementById('productList');
    
    // Get the next sequential row number
    const nextRowNumber = getNextRowNumber();
    
    // Create a new product row
    const newRow = document.createElement('div');
    newRow.className = 'product-row';
    
    // HTML for the new row - using the correct sequential number
    newRow.innerHTML = `
      <div class="row-number">${nextRowNumber}</div>
      <div class="product-grid">
        <div class="form-control">
          <label for="type">Type</label>
          <select name="type[]" class="type-select" required>
            <option value="">-- Select Type --</option>
          </select>
        </div>
        
        <div class="form-control">
          <label>Item Name</label>
          <select name="itemName[]" class="item-select" required>
            <option value="">-- Select Item Name --</option>
          </select>
        </div>
        
        <div class="form-control">
          <label>Description</label>
          <select name="description[]" class="desc-select" required>
            <option value="">-- Select Description --</option>
          </select>
        </div>
        
        <div class="form-control">
          <label>Requested Quantity</label>
          <input type="number" name="quantity[]" min="1" required placeholder="Enter quantity"/>
        </div>

        <div class="form-control">
          <button type="button" class="delete-btn" onclick="deleteRow(this)">
            ✕ Delete
          </button>
        </div>
      </div>
    `;
    
    // Add the new row to the product list
    productList.appendChild(newRow);
    
    // Get the new select elements
    const newTypeSelect = newRow.querySelector('.type-select');
    const newItemSelect = newRow.querySelector('.item-select');
    const newDescSelect = newRow.querySelector('.desc-select'); // Get the new description select
    
    // Populate the type options in the new row
    populateTypeOptions(newTypeSelect);
    
    // Add change event listeners to the new selects
    newTypeSelect.addEventListener('change', handleTypeChange);
    newItemSelect.addEventListener('change', handleItemChange);
    newDescSelect.addEventListener('change', handleDescriptionChange); // Add listener for new description select
    
    // Update delete button states
    updateDeleteButtons();
  });

  // Initial setup for delete buttons
  updateDeleteButtons();

  // Prevent form submission if there are duplicates
  const requestForm = document.getElementById('requestForm');
  requestForm.addEventListener('submit', function(event) {
    if (!validateAllRows()) {
      event.preventDefault(); // Stop form submission
      events.stopPropagation();
      alert('Please correct the duplicate item combinations before submitting.');
    }
  });
});
  </script>
</body>
</html>
